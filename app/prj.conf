# ====================================================================
# HARDWARE & INTERNE GERÄTE-TREIBER (STM32G474)
# ====================================================================
CONFIG_GPIO=y
CONFIG_CAN=y
CONFIG_REBOOT=y

# ====================================================================
# FLASH-SPEICHER & SPEICHERABSTRAKTION (Firmware-Update via 0x36)
# ====================================================================
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# ====================================================================
# MCUBOOT BOOTLOADER-INTEGRATION & IMAGE-MANAGEMENT
# ====================================================================
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y

# ====================================================================
# KEY-VALUE STORAGE / NVS (Manipulationssicherer Lockout via KVSS)
# ====================================================================
CONFIG_FILE_SYSTEM=y
CONFIG_NVS=y

# ====================================================================
# UDS-SERVER MODUL INITIALISIERUNG & PARAMETER (Treiber-Kconfig)
# ====================================================================
CONFIG_UDS_SERVER=y
CONFIG_UDS_CAN_RX_ID=0x7E0
CONFIG_UDS_CAN_TX_ID=0x7E8
CONFIG_UDS_S3_TIMEOUT_MS=5000
CONFIG_ISOTP_RX_BUF_COUNT=4

# ====================================================================
# KERNEL LOGGING & DIAGNOSE (ST-Link Virtueller COM-Port)
# ====================================================================
CONFIG_LOG=y
CONFIG_CAN_LOG_LEVEL_INF=y
