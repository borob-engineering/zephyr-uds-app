# --- HARDWARE & DEVICE TREIBER ---
CONFIG_GPIO=y
CONFIG_CAN=y
CONFIG_REBOOT=y

# Zephyr interne Flash-Treiber-API aktivieren
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y

# KORREKTUR: CONFIG_FLASH_HAS_DRIVER_ENABLED wurde hier entfernt!

# --- UDS SERVER CONFIGURATION ---
CONFIG_UDS_SERVER=y
CONFIG_UDS_CAN_RX_ID=0x7E0
CONFIG_UDS_CAN_TX_ID=0x7E8

# ISO-TP Puffer-Stabilität für Zephyr 4.4.0
CONFIG_ISOTP_RX_BUF_COUNT=4

# Logging
CONFIG_LOG=y
CONFIG_CAN_LOG_LEVEL_INF=y
