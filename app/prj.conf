# ====================================================================
# HARDWARE & INTERNE GERÄTE-TREIBER (STM32G474)
# ====================================================================
CONFIG_GPIO=y
CONFIG_CAN=y
CONFIG_REBOOT=y

# ====================================================================
# FLASH-SPEICHER & SPEICHERABSTRAKTION (Firmware-Update via 0x36)
# ====================================================================
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y

# ====================================================================
# PERSISTENTES DATEISYSTEM (Manipulationssicherer Lockout via NVS)
# ====================================================================
CONFIG_FILE_SYSTEM=y
CONFIG_NVS=y

# ====================================================================
# UDS-SERVER MODUL INITIALISIERUNG & PARAMETER (Treiber-Kconfig)
# ====================================================================
CONFIG_UDS_SERVER=y

# Physikalische CAN-IDs des Steuergeräts
CONFIG_UDS_CAN_RX_ID=0x7E0
CONFIG_UDS_CAN_TX_ID=0x7E8

# Zyklische S3-Verbindungsüberwachung (Inaktivitäts-Timeout in ms)
CONFIG_UDS_S3_TIMEOUT_MS=5000

# ====================================================================
# ISO-TP TRANSPORTSCHICHT-OPTIMIERUNG (Stabilität bei Consecutive Frames)
# ====================================================================
# Pufferanzahl für segmentierte Multi-Frame-Übertragungen (Firmware-Streaming)
CONFIG_ISOTP_RX_BUF_COUNT=4

# ====================================================================
# KERNEL LOGGING & DIAGNOSE (ST-Link Virtueller COM-Port)
# ====================================================================
CONFIG_LOG=y
CONFIG_CAN_LOG_LEVEL_INF=y
