# Kernel & Hardware Treiber
CONFIG_GPIO=y
CONFIG_CAN=y
CONFIG_REBOOT=y

# UDS Modul aktivieren
CONFIG_UDS_SERVER=y
CONFIG_UDS_CAN_RX_ID=0x7E0
CONFIG_UDS_CAN_TX_ID=0x7E8

# ISO-TP Puffer-Stabilität für Zephyr 4.4.0
CONFIG_ISOTP_RX_BUF_COUNT=4

# Logging zur Diagnose über die serielle Konsole (ST-Link)
CONFIG_LOG=y
CONFIG_CAN_LOG_LEVEL_INF=y
